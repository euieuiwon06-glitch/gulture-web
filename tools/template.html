<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gulture — Clothes in Motion</title>
<meta name="description" content="gulture — a more human approach to fitting. Web prototype built from the Figma design.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@900&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink: #121212; --paper: #ffffff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--paper); color: var(--ink); overflow-x: hidden; }
  body { font-family: 'Geist', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  #viewport { position: relative; width: 100vw; overflow: hidden; }
  /* one stage per Figma size (1440x900 / 1920x1080 / 2048x940); only the best-fitting one is shown */
  .stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; display: none; }
  .stage.on { display: block; }
  .screen { position: absolute; inset: 0; overflow: hidden; display: none; }
  .logo { -webkit-mask: url(assets/logo.svg) center / 100% 100% no-repeat; mask: url(assets/logo.svg) center / 100% 100% no-repeat; }
  .screen.on { display: block; animation: fade .45s ease both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .n { position: absolute; }
  .n svg { display: block; overflow: visible; }
  .t { line-height: normal; }
  .link { cursor: pointer; }
  .btn { transition: transform .2s ease, filter .2s ease; }
  .btn:hover { filter: brightness(1.18); }
  .t.link:hover { opacity: .6; }
  .photo { transition: filter .3s ease; }
  .photo:hover { filter: brightness(.94); }
  .load-fill { animation: load 2.4s cubic-bezier(.6,0,.2,1) both; }
  @keyframes load { from { width: 0; } }

  #menu { position: fixed; inset: 0; background: rgba(255,255,255,.97); z-index: 10; display: none;
          padding: 72px 6vw; overflow-y: auto; }
  #menu.on { display: block; animation: fade .3s ease both; }
  #menu header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 40px; }
  #menu .logo { display: block; width: 118px; height: 40px; background: var(--ink); }
  #menu button { background: none; border: 0; font: 500 14px 'Geist', sans-serif; letter-spacing: .18em; cursor: pointer; color: var(--ink); }
  #menu nav { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); border-top: 1px solid var(--ink); }
  #menu a { display: flex; gap: 20px; align-items: baseline; padding: 18px 0; border-bottom: 1px solid var(--ink);
            color: var(--ink); text-decoration: none; font-size: 17px; letter-spacing: .04em; margin-right: 24px; }
  #menu a span { font-family: 'Doto', monospace; font-weight: 900; font-size: 22px; min-width: 34px; }
  #menu a:hover, #menu a.cur { opacity: .5; }

  /* interactive states (assets/interact.js) */
  .ui { cursor: pointer; }
  .mv { transition: left .3s cubic-bezier(.3,.7,.2,1), width .3s cubic-bezier(.3,.7,.2,1); }
  .rot { transition: transform .3s ease; }
  .edit span { cursor: text; border-bottom: 1px dashed transparent; }
  .edit:hover span, .edit span:focus { border-bottom-color: #bbb; }
  .chat-input { background: transparent; border: 0; outline: none; }
  .chat-input::placeholder { color: #808080; opacity: 1; }
  #toast { position: fixed; left: 50%; bottom: 32px; transform: translate(-50%, 12px); background: #121212; color: #fff;
           font: 400 14px 'Geist', sans-serif; letter-spacing: .14em; padding: 14px 26px; border-radius: 30px;
           opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease; z-index: 20; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div id="viewport">
{{STAGES}}
</div>

<div id="menu" role="dialog" aria-label="Screens">
  <header><span class="logo" role="img" aria-label="gulture"></span><button type="button" id="close">CLOSE</button></header>
  <nav>{{MENU}}</nav>
</div>

<script>
(() => {
  const ORDER = {{ORDER}};
  const stages = [...document.querySelectorAll('.stage')];
  let stage = stages[0];
  const vp = document.getElementById('viewport');
  const menu = document.getElementById('menu');
  let timer = null;

  // pick the Figma size whose aspect ratio is closest to the window, then fit it
  // inside the window without cropping; portrait screens use the 1440 set at full
  // width and scroll
  function fit() {
    const W = window.innerWidth, H = window.innerHeight;
    const portrait = W < H;
    let best = stages[0];
    if (!portrait) {
      const r = Math.log(W / H);
      best = stages.reduce((a, b) =>
        Math.abs(Math.log(b.dataset.w / b.dataset.h) - r) < Math.abs(Math.log(a.dataset.w / a.dataset.h) - r) ? b : a);
    }
    if (best !== stage) { stage = best; show(current()); }
    stages.forEach(s => s.classList.toggle('on', s === stage));
    const sw = +stage.dataset.w, sh = +stage.dataset.h;
    const s = portrait ? W / sw : Math.min(W / sw, H / sh);
    const left = (W - sw * s) / 2;
    const top = portrait ? 0 : (H - sh * s) / 2;
    stage.style.transform = 'translate(' + left + 'px,' + top + 'px) scale(' + s + ')';
    vp.style.height = (portrait ? sh * s : H) + 'px';
    document.documentElement.style.overflowY = portrait ? 'auto' : 'hidden';
    document.documentElement.dataset.size = stage.dataset.set;
  }

  function show(slug) {
    if (!ORDER.includes(slug)) slug = ORDER[0];
    let cur = null;
    document.querySelectorAll('.screen').forEach(el => {
      const on = el.dataset.slug === slug && el.parentNode === stage;
      el.classList.toggle('on', on);
      if (on) cur = el;
    });
    menu.querySelectorAll('a').forEach(a => a.classList.toggle('cur', a.getAttribute('href') === '#/' + slug));
    document.title = 'gulture — ' + cur.dataset.title;
    clearTimeout(timer);
    if (slug === 'loading') timer = setTimeout(() => go('directions'), 2600);
    window.scrollTo(0, 0);
  }

  function go(slug) { location.hash = '#/' + slug; }
  const current = () => location.hash.replace(/^#\/?/, '') || ORDER[0];

  vp.addEventListener('click', e => {
    const el = e.target.closest('[data-go],[data-menu]');
    if (!el) return;
    if (el.dataset.menu) { menu.classList.add('on'); return; }
    go(el.dataset.go);
  });
  document.getElementById('close').onclick = () => menu.classList.remove('on');
  menu.addEventListener('click', e => { if (e.target.closest('a')) menu.classList.remove('on'); });

  document.addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('input, [contenteditable="true"]')) return;
    if (e.key === 'Escape') return menu.classList.remove('on');
    const i = ORDER.indexOf(current());
    if (e.key === 'ArrowRight') go(ORDER[Math.min(i + 1, ORDER.length - 1)]);
    if (e.key === 'ArrowLeft') go(ORDER[Math.max(i - 1, 0)]);
  });

  window.addEventListener('hashchange', () => show(current()));
  window.addEventListener('resize', fit);
  fit();
  show(current());
})();
</script>
<script src="assets/interact.js"></script>
</body>
</html>
